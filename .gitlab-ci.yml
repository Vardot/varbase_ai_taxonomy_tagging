################################################################################
# GitLab CI for the Varbase AI Taxonomy Tagging recipe, on the Drupal GitLab CI
# templates: https://project.pages.drupalcode.org/gitlab_templates/
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    # Pinned on purpose. Bump it together with _CURL_TEMPLATES_REF.
    ref: '1.17.2'
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _CURL_TEMPLATES_REF: '1.17.2'
  _ALL_VALIDATE_ALLOW_FAILURE: '0'
  # The verbatim GPL text, not ours to spell-check.
  _CSPELL_IGNORE_PATHS: 'LICENSE'
  _CSPELL_WORDS: 'automator, automators'
  # A recipe ships no PHP, JavaScript or CSS for these to check.
  SKIP_PHPSTAN: '1'
  SKIP_ESLINT: '1'
  SKIP_STYLELINT: '1'

composer:
  variables:
    DRUPAL_CORE: '11.4.9'

composer-lint:
  allow_failure: false

cspell:
  allow_failure: false

# The template runs PHPCS only where PHP files exist; run it on the recipe YAML.
phpcs:
  rules:
    - when: on_success
  allow_failure: false

yaml lint:
  stage: validate
  needs: []
  image: python:3.12-slim
  allow_failure: false
  script:
    - pip install --quiet --no-cache-dir pyyaml
    - |
      python3 - <<'PY'
      import glob, sys, yaml
      failed = 0
      for path in ['recipe.yml'] + sorted(glob.glob('config/**/*.yml', recursive=True)):
          try:
              yaml.safe_load(open(path, encoding='utf-8'))
              print('OK', path)
          except Exception as error:
              print('INVALID', path, error)
              failed += 1
      sys.exit(1 if failed else 0)
      PY

# Install Drupal, apply Varbase AI Default (the documented prerequisite) and
# this recipe, then check what the recipe set up.
apply recipe:
  extends: .testing-job-base
  needs: [composer]
  allow_failure: false
  services:
    - !reference [.with-database]
  script:
    - !reference [.simpletest-db]
    - composer require drupal/varbase_ai_default:~1.0.0 --update-with-all-dependencies
    - DRUSH="$COMPOSER_BIN_DIR/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT"
    - $DRUSH site:install standard --db-url=$SIMPLETEST_DB --yes
    # Core's Article with Tags stands in for the Varbase Blog post the recipe defaults to.
    - $DRUSH recipe $CI_PROJECT_DIR/$_WEB_ROOT/core/recipes/article_tags --yes
    - $DRUSH recipe $CI_PROJECT_DIR/recipes/varbase_ai_default --yes
    # AI 1.1 declares the AI Automator schema as ai_automators.ai_automators.*, so the
    # config assertion fails on it; apply with assertions off, as on a production site.
    - php -d zend.assertions=0 $CI_PROJECT_DIR/vendor/drush/drush/drush.php --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $DRUPAL_PROJECT_FOLDER --input=varbase_ai_taxonomy_tagging.content_type=article --yes
    - |
      ENABLED="$($DRUSH pm:list --status=enabled --field=name)"
      for module in ai_automators; do
        grep -qx "$module" <<< "$ENABLED" || { echo "$module is not enabled"; exit 1; }
        echo "$module is enabled"
      done
    - |
      grep -q llm_taxonomy <<< "$($DRUSH config:get ai_automators.ai_automator.node.article.field_tags.default rule)" || { echo 'No tagging automator on Article tags'; exit 1; }
      echo 'Article tags have the llm_taxonomy automator'
    - $DRUSH config:get field.field.node.article.ai_automator_status field_type
